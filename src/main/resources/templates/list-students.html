<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Studenti</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
        }
        .table-responsive {
            margin-top: 20px;
        }
        .schedule-table {
            width: 100%;
            font-size: 0.9em;
        }
        .schedule-table td {
            padding: 2px 5px;
        }
        .admin-controls {
            display: none; /* Initially hidden */
        }
        /* Notification bar styles */
        #notification-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #28a745; /* Green for success */
            color: white;
            text-align: center;
            padding: 10px;
            z-index: 1000;
            display: none; /* Hidden by default */
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="notification-bar"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center">Lista de Studenti</h1>
        <button id="admin-toggle" class="btn btn-secondary">Admin Mode: OFF</button>
    </div>

    <div th:each="student : ${students}" class="card">
        <div class="card-header" th:text="${student.name}"></div>
        <div class="card-body">
            <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
            <p><strong>Major:</strong> <span th:text="${student.major}"></span></p>
            <a th:href="@{/quiz/{id}(id=${student.id})}" class="btn btn-info mb-3">Completeaza Quiz pentru Recomandari</a>

            <div class="table-responsive">
                <h5>Job Applications</h5>
                <table class="table table-bordered table-striped">
                    <thead class="thead-dark">
                    <tr>
                        <th>Companie</th>
                        <th>Job</th>
                        <th>Descriere</th>
                        <th>Orar</th>
                        <th>Status</th>
                        <th class="admin-controls">Actiuni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="app, iterStat : ${student.jobApplications}">
                        <td th:text="${app.company}"></td>
                        <td th:text="${app.jobTitle}"></td>
                        <td th:text="${app.description}"></td>
                        <td>
                            <table class="schedule-table">
                                <tr><td><strong>Tura:</strong></td><td th:text="${app.workSchedule['shift']}"></td></tr>
                                <tr><td><strong>Start:</strong></td><td th:text="${app.workSchedule['startTime']}"></td></tr>
                                <tr><td><strong>Sfarsit:</strong></td><td th:text="${app.workSchedule['endTime']}"></td></tr>
                                <tr><td><strong>Pauza:</strong></td><td th:text="${app.workSchedule['breakTime']}"></td></tr>
                            </table>
                        </td>
                        <td th:text="${app.status}"></td>
                        <td class="admin-controls">
                            <form th:action="@{/students/{studentId}/applications/{applicationId}/status(studentId=${student.id}, applicationId=${app.id})}" method="post" style="display: inline-block;">
                                <input type="hidden" name="status" value="ACCEPTED">
                                <button type="submit" class="btn btn-success btn-sm">Accept</button>
                            </form>
                            <form th:action="@{/students/{studentId}/applications/{applicationId}/status(studentId=${student.id}, applicationId=${app.id})}" method="post" style="display: inline-block;">
                                <input type="hidden" name="status" value="REJECTED">
                                <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(student.jobApplications)}">
                        <td colspan="6" class="text-center">Nici o aplicare deocamdata.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <a th:href="@{/students/{id}/apply(id=${student.id})}" class="btn btn-primary apply-button">Aplica la un job nou</a>
        </div>
    </div>
</div>

<!-- Include SockJS and STOMP.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    const adminToggle = document.getElementById('admin-toggle');
    let adminMode = false;

    adminToggle.addEventListener('click', () => {
        adminMode = !adminMode;
        updateView();
    });

    function updateView() {
        const adminControls = document.querySelectorAll('.admin-controls');
        const applyButtons = document.querySelectorAll('.apply-button');

        if (adminMode) {
            adminToggle.textContent = 'Admin Mode: ON';
            adminToggle.classList.remove('btn-secondary');
            adminToggle.classList.add('btn-danger');
            adminControls.forEach(c => c.style.display = 'table-cell');
            applyButtons.forEach(b => b.style.display = 'none');
        } else {
            adminToggle.textContent = 'Admin Mode: OFF';
            adminToggle.classList.remove('btn-danger');
            adminToggle.classList.add('btn-secondary');
            adminControls.forEach(c => c.style.display = 'none');
            applyButtons.forEach(b => b.style.display = 'inline-block');
        }
    }

    // Initial view setup
    updateView();

    // WebSocket Notification Logic
    const notificationBar = document.getElementById('notification-bar');
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws'); // '/ws' is the endpoint configured in WebSocketConfig
        stompClient = Stomp.over(socket);
        stompClient.connect({}, frame => {
            console.log('Connected: ' + frame);
            stompClient.subscribe('/topic/students', message => {
                showNotification(message.body);
            });
        }, error => {
            console.error('STOMP error: ' + error);
            // Optional: Reconnect after a delay
            setTimeout(connect, 5000);
        });
    }

    function showNotification(message) {
        notificationBar.textContent = message;
        notificationBar.style.display = 'block';
        setTimeout(() => {
            notificationBar.style.display = 'none';
        }, 5000); // Hide after 5 seconds
    }

    // Connect to WebSocket when the page loads
    connect();
</script>

</body>
</html>
