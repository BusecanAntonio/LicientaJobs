<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Studenti - Licență Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div id="notification-bar"></div>
<div th:replace="~{pdf-viewer :: viewer}"></div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>Licență Jobs
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <!-- Link către trigger-ul de import ESCO -->
                    <a class="nav-link text-warning fw-bold" th:href="@{/admin/import-esco}" onclick="return confirm('Durează câteva minute. Baza de date Neo4j/Memgraph trebuie să fie pornită. Continui?')">
                        <i class="bi bi-database-down"></i> Importă Date ESCO
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-3">
                    <button id="admin-toggle" class="btn btn-secondary btn-sm px-4 rounded-pill">
                        <i class="bi bi-shield-lock me-1"></i> Admin Mode: OFF
                    </button>
                </li>
                <li class="nav-item me-3">
                    <span class="navbar-text text-white">
                        Salut, <strong th:text="${session.loggedInUser}">User</strong>!
                    </span>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm px-4 rounded-pill">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-file-earmark-text me-2"></i>Aplicații Joburi</h5>
        <a th:href="@{/students(showHidden=${param.showHidden == null or param.showHidden[0] == 'false'})}"
           class="btn btn-sm btn-outline-secondary">
            <i th:if="${param.showHidden != null and param.showHidden[0] == 'true'}" class="bi bi-eye-slash-fill"></i>
            <i th:unless="${param.showHidden != null and param.showHidden[0] == 'true'}" class="bi bi-eye-fill"></i>
            <span th:text="${param.showHidden != null and param.showHidden[0] == 'true' ? 'Ascunde Arhivate' : 'Afișează Arhivate'}"></span>
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <div>
            <h2>Student Dashboard</h2>
            <p class="text-muted">Welcome, <strong th:text="${username}">User</strong>!</p>
        </div>
        <div>
            <a th:href="@{/change-password}" class="btn btn-outline-secondary btn-sm">Change Password</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-info text-center">
        Nu există studenți adăugați de tine. <a th:href="@{/students/add}" class="alert-link">Adaugă unul acum!</a>
    </div>

    <!--
        Pentru fiecare student:
        1) cardul vizual (din student-card.html)
        2) offcanvas + modalele lui (din student-modals.html)
        Se pasează explicit ${student} ca parametru fragmentului, ceea ce garantează
        scope-ul corect (în varianta veche, th:each era pus direct pe .card, iar
        offcanvas/modalele de după rămâneau tehnic în afara buclei).
    -->
    <th:block th:each="student, iterStat : ${students}">
        <div th:replace="~{student-card :: studentCard(${student})}"></div>
        <div th:replace="~{student-modals :: studentModals(${student})}"></div>
    </th:block>

    <!-- Modal universal pentru Vizualizare Aplicație (unul singur, folosit de toate cardurile) -->
    <div class="modal fade" id="viewApplicationModal" tabindex="-1" aria-labelledby="viewApplicationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewApplicationModalLabel">Detalii Aplicație</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h3 id="modalJobTitle">Titlu Job</h3>
                    <h5 id="modalCompany" class="text-muted mb-3">Companie</h5>
                    <p id="modalDescription">Descrierea jobului va apărea aici.</p>
                    <hr>
                    <h6>Cerințe (Skill-uri)</h6>
                    <div id="modalRequiredSkills">
                        <!-- Skill-urile vor fi injectate aici de JavaScript -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Închide</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    // Logică Admin Toggle
    const adminToggle = document.getElementById('admin-toggle');
    let adminMode = false;

    adminToggle.addEventListener('click', () => {
        adminMode = !adminMode;
        updateView();
    });

    function updateView() {
        const adminControls = document.querySelectorAll('.admin-controls');
        const applyButtons = document.querySelectorAll('.apply-button');

        if (adminMode) {
            adminToggle.innerHTML = '<i class="bi bi-shield-check me-1"></i> Admin Mode: ON';
            adminToggle.classList.replace('btn-secondary', 'btn-danger');
            adminControls.forEach(c => c.style.display = 'table-cell');
            applyButtons.forEach(b => b.style.display = 'none');
        } else {
            adminToggle.innerHTML = '<i class="bi bi-shield-lock me-1"></i> Admin Mode: OFF';
            adminToggle.classList.replace('btn-danger', 'btn-secondary');
            adminControls.forEach(c => c.style.display = 'none');
            applyButtons.forEach(b => b.style.display = 'inline-block');
        }
    }

    updateView();

    // WebSocket Logic
    const notificationBar = document.getElementById('notification-bar');
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, frame => {
            stompClient.subscribe('/topic/students', message => {
                showNotification(message.body);
            });
        }, error => {
            setTimeout(connect, 5000);
        });
    }
    function showNotification(message) {
        notificationBar.textContent = message;
        notificationBar.style.display = 'block';
        setTimeout(() => {
            notificationBar.style.display = 'none';
        }, 5000);
    }

    connect();
</script>

</body>
</html>
