<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h1>Add New Student</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/students/add}" th:object="${student}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input id="name" th:field="*{name}" type="text" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input id="email" th:field="*{email}" type="email" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">Date of Birth:</label>
                            <input id="dateOfBirth" th:field="*{dateOfBirth}" type="date" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="major" class="form-label">Major:</label>
                            <input id="major" th:field="*{major}" type="text" class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number:</label>
                            <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" class="form-control" maxlength="10"/>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address:</label>
                            <input id="address" th:field="*{address}" type="text" class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label for="group" class="form-label">Group:</label>
                            <input id="group" th:field="*{group}" type="text" class="form-control"/>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startYear" class="form-label">Start Year:</label>
                                <input id="startYear" th:field="*{startYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endYear" class="form-label">End Year:</label>
                                <input id="endYear" th:field="*{endYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Student</button>
                        <a th:href="@{/students}" class="btn btn-secondary">Back to Students</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
