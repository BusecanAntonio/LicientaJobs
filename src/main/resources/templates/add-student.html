<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h1>Add New Student</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/students/add}" th:object="${student}" method="post">
                        <!-- Existing student fields -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input id="name" th:field="*{name}" type="text" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input id="email" th:field="*{email}" type="email" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">Date of Birth:</label>
                            <input id="dateOfBirth" th:field="*{dateOfBirth}" type="date" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="major" class="form-label">Major:</label>
                            <input id="major" th:field="*{major}" type="text" class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number:</label>
                            <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" class="form-control" maxlength="10"/>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address:</label>
                            <input id="address" th:field="*{address}" type="text" class="form-control"/>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startYear" class="form-label">Start Year:</label>
                                <input id="startYear" th:field="*{startYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endYear" class="form-label">End Year:</label>
                                <input id="endYear" th:field="*{endYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                        </div>

                        <!-- New fields for job interest and questions -->
                        <div class="mb-3">
                            <label for="interestedDomain" class="form-label">Interested Domain:</label>
                            <select id="interestedDomain" th:field="*{interestedDomainId}" class="form-select" required>
                                <option value="">Select a domain</option>
                                <option th:each="job : ${availableJobs}" th:value="${job.id}" th:text="${job.jobTitle}" th:attr="data-interviu=${job.interviu}"></option>
                            </select>
                        </div>

                        <div id="questions-container" class="mb-3">
                            <!-- Questions will be dynamically inserted here -->
                        </div>

                        <button type="submit" class="btn btn-primary">Add Student</button>
                        <a th:href="@{/students}" class="btn btn-secondary">Back to Students</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const interestedDomainSelect = document.getElementById('interestedDomain');
        const questionsContainer = document.getElementById('questions-container');
        let allQuestions = [];

        // Fetch all questions once
        fetch('/questions.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok for questions.json');
                }
                return response.json();
            })
            .then(data => {
                console.log('Successfully fetched questions.json');
                allQuestions = data;
            })
            .catch(error => console.error('Error fetching questions:', error));

        interestedDomainSelect.addEventListener('change', function () {
            const selectedOption = this.options[this.selectedIndex];
            const selectedJobId = this.value;
            const needsInterview = selectedOption.getAttribute('data-interviu') === 'true';

            // Console logs for debugging
            console.log('Selected Job ID:', selectedJobId);
            console.log('Needs Interview?:', needsInterview);

            questionsContainer.innerHTML = ''; // Clear previous questions

            if (selectedJobId && needsInterview) {
                // Use parseInt to ensure the ID is a number for comparison
                const jobIdNumber = parseInt(selectedJobId, 10);
                const jobQuestionsData = allQuestions.find(q => q.jobId === jobIdNumber);

                console.log('Found questions data:', jobQuestionsData);

                if (jobQuestionsData && jobQuestionsData.questions) {
                    console.log('Found questions. Generating HTML...');
                    const questionsToDisplay = jobQuestionsData.questions.slice(0, 5);

                    questionsToDisplay.forEach((question) => {
                        const formGroup = document.createElement('div');
                        formGroup.classList.add('mb-3');

                        const label = document.createElement('label');
                        label.classList.add('form-label');
                        label.textContent = question.questionText;

                        let inputElement;
                        const inputName = `applicationAnswers[${question.questionText}]`;

                        if (question.type === 'TEXT') {
                            inputElement = document.createElement('textarea');
                            inputElement.classList.add('form-control');
                            inputElement.name = inputName;
                            inputElement.rows = 2;
                        } else if (question.type === 'MULTIPLE_CHOICE') {
                            inputElement = document.createElement('select');
                            inputElement.classList.add('form-select');
                            inputElement.name = inputName;

                            const defaultOption = document.createElement('option');
                            defaultOption.value = '';
                            defaultOption.textContent = 'Select an option';
                            inputElement.appendChild(defaultOption);

                            question.options.forEach(optionText => {
                                const option = document.createElement('option');
                                option.value = optionText;
                                option.textContent = optionText;
                                inputElement.appendChild(option);
                            });
                        }

                        if(inputElement) {
                            formGroup.appendChild(label);
                            formGroup.appendChild(inputElement);
                            questionsContainer.appendChild(formGroup);
                        }
                    });
                } else {
                    console.log('No questions found for this job ID in questions.json.');
                }
            }
        });
    });
</script>
</body>
</html>
