<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaugă Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .domain-checkbox {
            display: none;
        }
        .domain-label {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border: 2px solid #0d6efd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0d6efd;
            background-color: white;
            font-weight: 500;
        }
        .domain-checkbox:checked + .domain-label {
            background-color: #0d6efd;
            color: white;
            box-shadow: 0 4px 6px rgba(13, 110, 253, 0.2);
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Adaugă / Editează Profil Student</h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/students/add}" th:object="${student}" method="post">

                        <h4 class="mb-3 text-secondary border-bottom pb-2">1. Date Personale</h4>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label fw-bold">Nume Complet:</label>
                                <input id="name" th:field="*{name}" type="text" class="form-control" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">Email:</label>
                                <input id="email" th:field="*{email}" type="email" class="form-control" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phoneNumber" class="form-label fw-bold">Telefon:</label>
                                <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" class="form-control"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dateOfBirth" class="form-label fw-bold">Data Nașterii:</label>
                                <input id="dateOfBirth" th:field="*{dateOfBirth}" type="date" class="form-control" required/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label fw-bold">Adresă / Oraș:</label>
                            <input id="address" th:field="*{address}" type="text" class="form-control"/>
                        </div>

                        <h4 class="mb-3 mt-4 text-secondary border-bottom pb-2">2. Studii</h4>
                        <div class="mb-3">
                            <label for="major" class="form-label fw-bold">Specializare (Facultate/Profil):</label>
                            <input id="major" th:field="*{major}" type="text" class="form-control" placeholder="ex: Calculatoare, Informatică..."/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startYear" class="form-label fw-bold">An Începere:</label>
                                <input id="startYear" th:field="*{startYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endYear" class="form-label fw-bold">An Finalizare (Estimat):</label>
                                <input id="endYear" th:field="*{endYear}" type="number" class="form-control" min="1900" max="2100"/>
                            </div>
                        </div>

                        <h4 class="mb-3 mt-4 text-secondary border-bottom pb-2">3. Interese în Carieră (Taxonomie IT)</h4>
                        <p class="text-muted small">Selectează domeniile mari care te atrag. Pe baza acestora, îți vom recomanda subcategorii specifice.</p>

                        <div class="mb-4">
                            <!-- Nivelul 1: Categorii (Hardcoded for UX initially, could be dynamic) -->
                            <div class="d-flex flex-wrap gap-2" id="domain-container">
                                <div>
                                    <input type="checkbox" id="dom_sw" class="domain-checkbox" value="Software Engineering">
                                    <label for="dom_sw" class="domain-label">Software Engineering</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_ai" class="domain-checkbox" value="AI / Machine Learning">
                                    <label for="dom_ai" class="domain-label">AI / Machine Learning</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_data" class="domain-checkbox" value="Data & Analytics">
                                    <label for="dom_data" class="domain-label">Data & Analytics</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_cloud" class="domain-checkbox" value="Cloud / DevOps / Infra">
                                    <label for="dom_cloud" class="domain-label">Cloud / DevOps</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_cyber" class="domain-checkbox" value="Cybersecurity">
                                    <label for="dom_cyber" class="domain-label">Cybersecurity</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_hw" class="domain-checkbox" value="Embedded / Hardware">
                                    <label for="dom_hw" class="domain-label">Hardware / Embedded</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_ux" class="domain-checkbox" value="Product / UX / Design">
                                    <label for="dom_ux" class="domain-label">UX / Product</label>
                                </div>
                                <div>
                                    <input type="checkbox" id="dom_game" class="domain-checkbox" value="Gaming / Media Tech">
                                    <label for="dom_game" class="domain-label">Gaming</label>
                                </div>
                            </div>
                        </div>

                        <!-- Container pentru Subcategorii (Apare dinamic pe baza a ce s-a selectat sus) -->
                        <div id="subcategories-section" class="mb-4" style="display: none; background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;">
                            <h5 class="fw-bold mb-3">Roluri Specifice (Alege ce ți se potrivește)</h5>
                            <div id="subcategories-container" class="d-flex flex-wrap gap-2">
                                <!-- Vor fi injectate prin JavaScript -->
                            </div>

                            <!-- Aici vom păstra ca String subcategoriile alese pentru a le trimite spre Backend -->
                            <!-- Pentru moment refolosim câmpul interestedDomainId sau un camp custom,
                                 ideea e să salvăm intențiile -->
                            <input type="hidden" id="selectedSubcategories" name="applicationAnswers[UserInterests]">
                        </div>


                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                            <a th:href="@{/students}" class="btn btn-outline-secondary me-md-2">Anulează</a>
                            <button type="submit" class="btn btn-primary px-5 fw-bold">Salvează Profilul</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Dictionar intern (simplificat pentru frontend, dar ar trebui adus din backend ideal)
    const taxonomyMap = {
        "Software Engineering": ["Frontend Developer", "Backend Developer", "Full Stack Developer", "Mobile Developer", "QA Automation"],
        "AI / Machine Learning": ["ML Engineer", "Data Scientist", "Computer Vision Engineer", "NLP Engineer"],
        "Data & Analytics": ["Data Analyst", "BI Developer", "Data Engineer"],
        "Cloud / DevOps / Infra": ["DevOps Engineer", "Cloud Engineer", "Site Reliability Engineer"],
        "Cybersecurity": ["SOC Analyst", "Security Engineer", "Pentester"],
        "Embedded / Hardware": ["Embedded Engineer", "Firmware Engineer", "IoT Engineer", "Robotics Engineer"],
        "Product / UX / Design": ["Product Manager", "UX Designer", "UI Designer"],
        "Gaming / Media Tech": ["Game Developer", "Unity Developer", "Graphics Programmer"]
    };

    document.addEventListener('DOMContentLoaded', function() {
        const domainCheckboxes = document.querySelectorAll('.domain-checkbox');
        const subcatSection = document.getElementById('subcategories-section');
        const subcatContainer = document.getElementById('subcategories-container');
        const hiddenInput = document.getElementById('selectedSubcategories');

        let selectedDomains = new Set();
        let selectedSubcats = new Set();

        domainCheckboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                if (this.checked) {
                    selectedDomains.add(this.value);
                } else {
                    selectedDomains.delete(this.value);
                    // Daca un domeniu e deselectat, scoatem si subcategoriile lui din selectie
                    (taxonomyMap[this.value] || []).forEach(sub => selectedSubcats.delete(sub));
                }

                renderSubcategories();
            });
        });

        function renderSubcategories() {
            subcatContainer.innerHTML = '';

            if (selectedDomains.size === 0) {
                subcatSection.style.display = 'none';
                hiddenInput.value = '';
                return;
            }

            subcatSection.style.display = 'block';

            selectedDomains.forEach(domain => {
                const subcats = taxonomyMap[domain] || [];

                // Add a small header for the domain
                const header = document.createElement('div');
                header.className = 'w-100 mt-2 mb-1 text-primary fw-bold small';
                header.textContent = domain;
                subcatContainer.appendChild(header);

                subcats.forEach(sub => {
                    const div = document.createElement('div');

                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'domain-checkbox subcat-cb';
                    cb.id = 'sub_' + sub.replace(/\s+/g, '_');
                    cb.value = sub;
                    if(selectedSubcats.has(sub)) cb.checked = true;

                    const lbl = document.createElement('label');
                    lbl.htmlFor = cb.id;
                    lbl.className = 'domain-label px-2 py-1 fs-6';
                    lbl.style.borderColor = '#6c757d';
                    lbl.style.color = '#495057';
                    lbl.textContent = sub;

                    cb.addEventListener('change', function() {
                        if(this.checked) selectedSubcats.add(this.value);
                        else selectedSubcats.delete(this.value);

                        // Actualizam input-ul hidden cu o lista delimitata de virgula
                        hiddenInput.value = Array.from(selectedSubcats).join(', ');

                        // Schimbam culoarea cand e selectat
                        if(this.checked) {
                            lbl.style.backgroundColor = '#6c757d';
                            lbl.style.color = 'white';
                        } else {
                            lbl.style.backgroundColor = 'white';
                            lbl.style.color = '#495057';
                        }
                    });

                    // Trigger event to set initial style if already checked
                    if(cb.checked) {
                        lbl.style.backgroundColor = '#6c757d';
                        lbl.style.color = 'white';
                    }

                    div.appendChild(cb);
                    div.appendChild(lbl);
                    subcatContainer.appendChild(div);
                });
            });
        }
    });
</script>
</body>
</html>
