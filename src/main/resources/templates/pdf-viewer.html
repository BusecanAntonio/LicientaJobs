<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="viewer">

    <div class="modal fade" id="pdfViewerModal" tabindex="-1" aria-labelledby="pdfViewerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content" style="height: 90vh;">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="pdfViewerModalLabel">
                        <i class="bi bi-file-earmark-pdf me-2"></i>Vizualizare Document
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="pdf-iframe" style="width: 100%; height: 100%; border: none;"></iframe>

                    <div id="pdf-loading" class="d-flex justify-content-center align-items-center" style="height: 100%;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Se încarcă...</span>
                        </div>
                    </div>

                    <div id="pdf-error" class="text-center text-danger p-4" style="display: none;">
                        <i class="bi bi-exclamation-triangle fs-1"></i>
                        <p class="mt-2">Eroare la încărcarea documentului. Posibil să nu ai permisiunea sau fișierul nu mai există.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function viewDocument(studentId, filename) {
            const modal = new bootstrap.Modal(document.getElementById('pdfViewerModal'));
            const iframe = document.getElementById('pdf-iframe');
            const loading = document.getElementById('pdf-loading');
            const errorDiv = document.getElementById('pdf-error');

            // Resetăm starea ferestrei
            iframe.style.display = 'none';
            iframe.src = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'flex';

            modal.show();

            // Fetch securizat pentru evitarea problemelor CORS și transmiterea sesiunii
            fetch(`/students/${studentId}/documents/${filename}`)
                .then(response => {
                    if (!response.ok) throw new Error('Răspunsul rețelei nu a fost ok');
                    return response.blob();
                })
                .then(blob => {
                    // Generăm un URL temporar securizat din blob-ul primit
                    const fileURL = URL.createObjectURL(new Blob([blob], { type: blob.type || 'application/pdf' }));
                    iframe.src = fileURL;

                    loading.style.display = 'none';
                    iframe.style.display = 'block';
                })
                .catch(error => {
                    console.error("Eroare la obținerea documentului:", error);
                    loading.style.display = 'none';
                    errorDiv.style.display = 'block';
                });
        }

        // Curățare memorie pentru prevenirea memory leaks
        document.getElementById('pdfViewerModal').addEventListener('hidden.bs.modal', function () {
            const iframe = document.getElementById('pdf-iframe');
            if (iframe.src.startsWith('blob:')) {
                URL.revokeObjectURL(iframe.src);
            }
            iframe.src = '';
        });
    </script>
</div>

</body>
</html>
