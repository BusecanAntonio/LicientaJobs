<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-5">
                <div class="card-body">
                    <h1 class="display-4 mb-4">Rezultatul Tău</h1>
                    <p class="lead">Trăsătura ta dominantă este:</p>
                    <h2 class="text-primary fw-bold" th:text="${result}">LEADERSHIP</h2>
                    <hr class="my-4">
                    <p class="text-muted" th:text="${description}">Descrierea trăsăturii...</p>
                    <a th:href="@{/students}" class="btn btn-lg btn-success mt-4">Înapoi la Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
