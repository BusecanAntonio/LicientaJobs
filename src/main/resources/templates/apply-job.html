<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aplica la un Job</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Joburi Disponibile</h1>
    <h4 class="text-center text-muted"> Aplicant  <span th:text="${student.name}"></span></h4>

    <div class="table-responsive mt-4">
        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
            <tr>
                <th>Companie</th>
                <th>Job</th>
                <th>Descriere</th>
                <th>Orar</th>
                <th>Actiune</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${availableJobs}">
                <td th:text="${job.company}"></td>
                <td th:text="${job.jobTitle}"></td>
                <td th:text="${job.description}"></td>
                <td>
                    <table class="table table-sm">
                        <tr><td><strong>Tura:</strong></td><td th:text="${job.workSchedule['shift']}"></td></tr>
                        <tr><td><strong>Program:</strong></td><td th:text="${job.workSchedule['startTime']} + ' - ' + ${job.workSchedule['endTime']}"></td></tr>
                        <tr><td><strong>Pauza:</strong></td><td th:text="${job.workSchedule['breakTime']}"></td></tr>
                    </table>
                </td>
                <td>
                    <form th:action="@{/students/{id}/apply(id=${student.id})}" method="post">
                        <input type="hidden" name="id" th:value="${job.id}" />
                        <button type="submit" class="btn btn-success">Aplica</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a th:href="@{/students}" class="btn btn-secondary">Inapoi</a>
    </div>
</div>
</body>
</html>
