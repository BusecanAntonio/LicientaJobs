<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header">
                    <h1 class="mb-0" th:text="'Întrebarea ' + ${currentQuestionNumber} + ' din ' + ${totalQuestions}">Question</h1>
                </div>
                <div class="card-body">
                    <p class="lead" th:text="${question.text}">Question text...</p>
                    <form th:action="@{/students/{studentId}/quiz/answer(studentId=${studentId})}" method="post">
                        <div class="list-group">
                            <div th:each="answer : ${question.answers}" class="list-group-item">
                                <input class="form-check-input me-1" type="radio" name="answer" th:id="${answer.trait + question.id}" th:value="${answer.trait}" required>
                                <label class="form-check-label" th:for="${answer.trait + question.id}" th:text="${answer.text}"></label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4">Următoarea</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
