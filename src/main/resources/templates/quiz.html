<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <title>Quiz Orientare Carieră IT</title>
    <!-- Adaugă aici link-uri către CSS-ul tău, de ex. Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Quiz Orientare Carieră IT</h2>
            <p class="mb-0" th:text="'Student: ' + ${student.name}"></p>
        </div>
        <div class="card-body">
            <form th:action="@{/quiz/submit}" method="post">
                <input type="hidden" name="studentId" th:value="${student.id}" />

                <div th:each="question, iterStat : ${questions}" class="mb-4 p-3 border rounded bg-white">
                    <h5 class="fw-bold mb-3 text-primary" th:text="${iterStat.count} + '. ' + ${question.text}"></h5>

                    <div th:each="option, optStat : ${question.options}" class="form-check fs-5 mb-2">
                        <!-- ATENȚIE: Aici valoarea trimisă la server este direct DOMENIUL -->
                        <input class="form-check-input" type="radio"
                               th:name="'question_' + ${question.id}"
                               th:id="'q' + ${question.id} + 'opt' + ${optStat.index}"
                               th:value="${option.domain}" required>
                        <label class="form-check-label" style="cursor: pointer;"
                               th:for="'q' + ${question.id} + 'opt' + ${optStat.index}"
                               th:text="${option.text}">
                        </label>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success btn-lg px-5 fw-bold shadow-sm">
                        <i class="bi bi-send me-2"></i> Trimite Răspunsurile
                    </button>

                    <a th:href="@{/}" class="btn btn-secondary btn-lg ms-3 shadow-sm">
                        Înapoi la listă
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
